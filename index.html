      uptime: commandDefinition("Show this portfolio session's uptime", "uptime", () => { const seconds = Math.floor((Date.now()-sessionStarted)/1000); const hours = Math.floor(seconds/3600); const minutes = Math.floor((seconds%3600)/60); printText(`portfolio session up ${hours ? `${hours}h ` : ""}${minutes}m ${seconds%60}s`); }),
      date: commandDefinition("Show the browser-local date and time", "date", () => printText(new Intl.DateTimeFormat(undefined,{dateStyle:"full",timeStyle:"long"}).format(new Date()))),
      env: commandDefinition("Show fictional portfolio variables", "env", () => printText(["USER=guest","HOSTNAME=mahdi-portfolio","SHELL=/bin/portfolio-sh","HOME=/home/guest",`PORTFOLIO_OWNER=${portfolioData.identity.name}`,`PORTFOLIO_ROLE=${portfolioData.identity.role}`,`THEME=${document.documentElement.dataset.theme}`].join("\n"))),
      which: commandDefinition("Locate simulated portfolio tools", "which <go|node|docker|mahdi|portfolio>", args => { const allowed = ["go","node","docker","mahdi","portfolio"]; const tool = (args[0]||"").toLowerCase(); if (!allowed.includes(tool)) return printError(`${tool || "which"} not found in simulated PATH`); printText(`/usr/local/portfolio/bin/${tool}`); }),
      man: commandDefinition("Read concise portfolio manual pages", "man <portfolio|projects|skills|contact|ping>", args => { const pages = { portfolio:["PORTFOLIO(1)","Interactive browser terminal for Mahdi Nouri Sani's résumé.",'Run "help" to list safe, predefined commands.'], projects:["PROJECTS(1)",'List projects with "projects"; inspect one with "project <id>".'], skills:["SKILLS(1)",'Browse grouped skills. Options: --compact, --json, backend, blockchain, ai.'], contact:["CONTACT(1)",'Show public contact links. Phone output follows the privacy configuration.'], ping:["PING(1)",'Simulate 1–10 local replies. No network request is made. Ctrl+C cancels.'] }; const page = pages[(args[0]||"").toLowerCase()]; if (!page) return printError(`No manual entry for ${args[0] || "missing topic"}`); const block=outputBlock(); page.forEach((line,index)=>printText(line,index===0?"bright":"",block)); }),
      git: commandDefinition("Run simulated portfolio git views", "git <status|log|branch|remote|config>", args => {
        const sub = args[0]; if (sub === "status") return printText("On branch main\nYour portfolio is up to date.\nnothing to commit, working tree clean"); if (sub === "branch") return printText("* main", "success"); if (sub === "remote" && args[1] === "-v") return printText(`portfolio\t${portfolioData.links.github} (fetch)\nportfolio\t${portfolioData.links.github} (push)`); if (sub === "config" && args[1] === "user.name") return printText(portfolioData.identity.name); if (sub === "config" && args[1] === "user.email") return printText(portfolioData.identity.email);
        if (sub === "log") { const entries = [...portfolioData.projects].reverse().map(project => ({ key:`project-${project.number}`, date:project.end, text:`completed ${project.name}` })); portfolioData.experience.forEach(item => entries.push({key:`work-${item.id}`,date:item.start,text:`joined ${item.company} as ${item.role}`})); if (args.includes("--oneline")) return printText(entries.map(item => `${item.key.padEnd(18)} ${item.text}`).join("\n")); return printText(entries.map(item => `entry ${item.key}\nDate: ${item.date}\n\n    ${item.text}`).join("\n\n")); }
        printError("git: supported: status, log [--oneline], branch, remote -v, config user.name, config user.email");
      }),
      ping: commandDefinition("Simulate local ping output", "ping [-c 1..10] <host>", async args => {
        const countIndex = args.indexOf("-c"); const count = countIndex >= 0 ? Number(args[countIndex+1]) : 4; const host = args.find((arg,index) => !arg.startsWith("-") && index !== countIndex+1); const allowed = ["github.com","asino.ir","portfolio","localhost"];
        if (!host) return printError("ping: missing host"); if (!allowed.includes(host.toLowerCase())) return printError(`ping: ${host}: only predefined simulated hosts are available`); if (!Number.isInteger(count) || count < 1 || count > 10) return printError("ping: -c must be an integer from 1 to 10");
        const operation = { cancelled:false }; activeOperation = operation; const block = outputBlock(); printText(`PING ${host} (simulated): 56 data bytes`, "accent", block); let received = 0;
        for (let sequence=1; sequence<=count; sequence++) { if (operation.cancelled) break; if (!reducedMotion.matches) await delay(300); if (operation.cancelled) break; const latency=(12+Math.random()*11).toFixed(1); printText(`64 bytes from ${host}: icmp_seq=${sequence} ttl=57 time=${latency} ms`, "", block); received++; }
        if (operation.cancelled) printText("^C", "warning", block); printText(`--- ${host} simulated ping statistics ---`, "", block); printText(`${count} packets transmitted, ${received} received, ${Math.round((count-received)/count*100)}% packet loss`, "", block); if (activeOperation === operation) activeOperation = null;
      }),
      curl: commandDefinition("Read predefined portfolio JSON resources", "curl /api/<profile|projects|skills|contact>", args => { const resources = { "/api/profile":{ identity:{ name:portfolioData.identity.name, role:portfolioData.identity.role, headline:portfolioData.identity.headline, location:portfolioData.identity.location }, summary:portfolioData.summary }, "/api/projects":portfolioData.projects, "/api/skills":portfolioData.skills, "/api/contact":{ email:portfolioData.identity.email, github:portfolioData.links.github, linkedin:portfolioData.links.linkedin, telegram:portfolioData.links.telegram, location:portfolioData.identity.location } }; const resource=resources[args[0]]; if (!resource) return printError("curl: external network access is disabled in this portfolio simulation"); printJson(resource); }),
      echo: commandDefinition("Print text safely", "echo [text]", (args, context) => { const value = context.raw.replace(/^\s*echo(?:\s+|$)/i, ""); const parsed = tokenize(value); printText(parsed.tokens.join(" ")); }),
      history: commandDefinition("Show or clear command history", "history [clear]", args => { if (args[0]?.toLowerCase()==="clear") { commandHistory=[]; historyIndex=0; writeStorage("portfolio-command-history",commandHistory); return printSuccess("Command history cleared."); } printText(commandHistory.map((item,index)=>`${String(index+1).padStart(3)}  ${item}`).join("\n")); }),
      clear: commandDefinition("Clear terminal output", "clear", () => { historyElement.replaceChildren(); }),
      banner: commandDefinition("Show the welcome banner", "banner", () => showBanner()),
      reboot: commandDefinition("Replay the simulated startup", "reboot", async () => { stopMatrix(); historyElement.replaceChildren(); inputElement.disabled=true; await startup(); }),
      exit: commandDefinition("Close the simulated session", "exit", async () => { printText("Saving session...", "warning"); await delay(reducedMotion.matches?0:250); printText("Connection to mahdi-portfolio closed.", "muted"); connected=false; inputElement.disabled=true; reconnectButton.classList.add("visible"); document.querySelector(".session-dot").style.background="var(--error)"; document.querySelector(".session-label").textContent="CLOSED"; }),
      theme: commandDefinition("Inspect or change the terminal theme", "theme [list|name]", args => { const requested=(args[0]||"").toLowerCase(); if (!requested) return printText(`Current theme: ${document.documentElement.dataset.theme}`); if (requested==="list") return printText(THEMES.join("  ")); if (!THEMES.includes(requested)) return printError(`theme: unknown theme: ${requested}`); applyTheme(requested,true); printSuccess(`Theme changed to ${requested}.`); }),
      sudo: commandDefinition("Handle harmless sudo easter eggs", "sudo [hire-me|make me a sandwich]", args => { const phrase=args.join(" ").toLowerCase(); if (phrase==="hire-me") { const block=outputBlock(); printSuccess("Candidate profile unlocked: public contact channels only.",block); printLink(`Email: ${portfolioData.identity.email}`,`mailto:${portfolioData.identity.email}`,block); printLink(`GitHub: ${portfolioData.links.github}`,portfolioData.links.github,block); return; } if (phrase==="make me a sandwich") return printText("A backend developer prepared the API; the sandwich remains client-side."); printError("guest is not in the sudoers file. This simulated incident will not be reported."); }),
      rm: commandDefinition("Protect the simulated filesystem", "rm -rf /", args => { if (args.join(" ")==="-rf /") return printError("rm: refused: the simulated portfolio filesystem is read-only and protected"); printError("rm: write operations are disabled in this portfolio simulation"); }),
      coffee: commandDefinition("Brew a small ASCII coffee", "coffee", () => printText("   ( (\n    ) )\n  ........\n  |      |]\n  \\      /\n   `----'", "warning")),
      fortune: commandDefinition("Print a backend quotation", "fortune", () => { const fortunes=["Make invalid states unrepresentable.","A boring deployment is a successful deployment.","Measure first; optimize second.","Interfaces are promises. Keep them small."]; printText(fortunes[Math.floor(Math.random()*fortunes.length)]); }),
      cowsay: commandDefinition("Render a short safe ASCII message", "cowsay <text>", args => { const text=(args.join(" ")||"hello").slice(0,48); const border="-".repeat(text.length+2); printText(` ${border}\n< ${text} >\n ${border}\n        \\   ^__^\n         \\  (oo)\\_______\n            (__)\\       )\\/\\\n                ||----w |\n                ||     ||`); }),
      matrix: commandDefinition("Run a bounded visual effect", "matrix [stop]", args => { if (args[0]?.toLowerCase()==="stop") { stopMatrix(); return printSuccess("Matrix effect stopped."); } startMatrix(); })
    };

    /* Theme System */
    function applyTheme(theme, persist=false) { if (!THEMES.includes(theme)) theme="arch"; document.documentElement.dataset.theme=theme; document.getElementById("status-theme").textContent=theme; document.querySelector(".title-theme").textContent=theme; if (persist) writeStorage("portfolio-theme",theme); const colors={arch:"#070b10",graphite:"#090b0e",matrix:"#020704",amber:"#0d0903",ubuntu:"#100b12",light:"#e9e7e1"}; document.querySelector('meta[name="theme-color"]').content=colors[theme]; }
    function startMatrix() {
      stopMatrix(); if (reducedMotion.matches) { printWarning("Matrix effect simplified because reduced motion is enabled."); return; }
      const overlay=document.createElement("div"); overlay.className="matrix-overlay"; overlay.setAttribute("aria-hidden","true"); document.body.append(overlay);
      const columns=Math.min(24,Math.ceil(innerWidth/50)); for(let index=0;index<columns;index++){ const column=document.createElement("span"); column.className="matrix-column"; column.style.left=`${index*100/columns}%`; column.style.setProperty("--speed",`${3+Math.random()*3}s`); column.textContent=Array.from({length:28},()=>String.fromCharCode(0x30A0+Math.floor(Math.random()*80))).join("\n"); overlay.append(column); }
      matrixTimer=setTimeout(()=>stopMatrix(),8000); printSuccess('Matrix effect enabled for 8 seconds. Run "matrix stop" to stop it.');
    }
    function stopMatrix(){ if(matrixTimer){clearTimeout(matrixTimer);matrixTimer=null;} document.querySelector(".matrix-overlay")?.remove(); }

    /* Keyboard Handling */
    formElement.addEventListener("submit", async event => { event.preventDefault(); if (!connected || inputElement.disabled) return; const value=inputElement.value; inputElement.value=""; await runCommand(value); inputElement.focus(); });
    inputElement.addEventListener("keydown", event => {
      if (event.key==="ArrowUp") { event.preventDefault(); if (historyIndex>0) inputElement.value=commandHistory[--historyIndex]||""; inputElement.setSelectionRange(inputElement.value.length,inputElement.value.length); }
      else if (event.key==="ArrowDown") { event.preventDefault(); if (historyIndex<commandHistory.length) historyIndex++; inputElement.value=commandHistory[historyIndex]||""; inputElement.setSelectionRange(inputElement.value.length,inputElement.value.length); }
      else if (event.key==="Escape") { inputElement.value=""; }
      else if (event.key==="Tab") { event.preventDefault(); autocomplete(); }
      else if (event.ctrlKey && event.key.toLowerCase()==="l") { event.preventDefault(); historyElement.replaceChildren(); }
      else if (event.ctrlKey && event.key.toLowerCase()==="c" && activeOperation) { event.preventDefault(); activeOperation.cancelled=true; }
    });
    function autocomplete() {
      const value=inputElement.value; const first=value.trimStart().split(/\s/)[0].toLowerCase(); if (!first || value.trim().includes(" ")) return;
      const matches=Object.keys(commands).concat(Object.keys(aliases)).filter(name=>name.startsWith(first)).sort(); if(matches.length===1){ inputElement.value=value.replace(first,matches[0]); inputElement.setSelectionRange(inputElement.value.length,inputElement.value.length); } else if(matches.length>1){ printCommand(value); printText(matches.join("  "),"accent"); }
    }
    terminalElement.addEventListener("pointerdown", event => { if (!event.target.closest("a,button") && connected) inputElement.focus({preventScroll:true}); });
    reconnectButton.addEventListener("click", async () => { connected=true; reconnectButton.classList.remove("visible"); document.querySelector(".session-dot").style.background=""; document.querySelector(".session-label").textContent="CONNECTED"; inputElement.disabled=false; printSuccess("Connection re-established."); showBanner(); inputElement.focus(); });
    document.addEventListener("visibilitychange",()=>{ if(document.hidden) stopMatrix(); });

    /* Startup */
    function updateClock(){ document.getElementById("status-clock").textContent=new Intl.DateTimeFormat(undefined,{hour:"2-digit",minute:"2-digit",hour12:false}).format(new Date()); }
    function showBanner(){
      const block=outputBlock(); const wide=document.createElement("div"); wide.className="ascii"; wide.textContent="███╗   ███╗ █████╗ ██╗  ██╗██████╗ ██╗    ███╗   ██╗ ██████╗ ██╗   ██╗██████╗ ██╗\n████╗ ████║██╔══██╗██║  ██║██╔══██╗██║    ████╗  ██║██╔═══██╗██║   ██║██╔══██╗██║\n██╔████╔██║███████║███████║██║  ██║██║    ██╔██╗ ██║██║   ██║██║   ██║██████╔╝██║\n██║╚██╔╝██║██╔══██║██╔══██║██║  ██║██║    ██║╚██╗██║██║   ██║██║   ██║██╔══██╗██║\n██║ ╚═╝ ██║██║  ██║██║  ██║██████╔╝██║    ██║ ╚████║╚██████╔╝╚██████╔╝██║  ██║██║\n╚═╝     ╚═╝╚═╝  ╚═╝╚═╝  ╚═╝╚═════╝ ╚═╝    ╚═╝  ╚═══╝ ╚═════╝  ╚═════╝ ╚═╝  ╚═╝╚═╝\n                         BACKEND DEVELOPER";
      const compact=document.createElement("div"); compact.className="compact-banner"; compact.textContent="MAHDI NOURI SANI\nBACKEND DEVELOPER"; block.append(wide,compact);
    }
    async function startup(){
      const lines=["[ OK ] Initializing PortfolioOS","[ OK ] Loading résumé data","[ OK ] Mounting project filesystem","[ OK ] Starting command registry","[ OK ] Restoring terminal preferences","","Connecting to mahdi-portfolio...","Connection established.","","Welcome to PortfolioOS.",'Type "help" to list available commands.'];
      const block=outputBlock(); for(const line of lines){ printText(line,line.startsWith("[ OK ]")||line==="Connection established."?"success":line.startsWith("Connecting")?"muted":"",block); if(!reducedMotion.matches) await delay(line ? 105 : 35); }
      showBanner(); inputElement.disabled=false; connected=true; inputElement.focus({preventScroll:true}); writeStorage("portfolio-startup-seen",true);
    }
    applyTheme(readStorage("portfolio-theme","arch")); updatePathUI(); updateClock(); setInterval(updateClock,30000); inputElement.disabled=true; startup();
  </script>
